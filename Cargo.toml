[package]
name = "xrpl_wallet_manager"
version = "1.0.0"
edition = "2021"

# Pas de [[bin]] nécessaire : Cargo détecte automatiquement
# src/bin/cli.rs et src/bin/gui.rs comme deux binaires distincts.

[dependencies]
# Crypto / wallet
ed25519-dalek = "2"
sha2 = "0.10"
ripemd = "0.1"
aes-gcm = "0.10"
pbkdf2 = "0.12"
bs58 = { version = "0.5", features = ["check"] }
hex = "0.4"

# Aléatoire
rand = "0.8"
rand_chacha = "0.3"

# Sérialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Persistent, per-OS user data directory (wallets/ storage location)
directories = "6"

# GUI
iced = { version = "0.13", features = ["tokio", "advanced", "qr_code"] }
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "process"] }

# Charting (Trade tab -- OHLC/candlestick price chart). `plotters` is the
# de-facto standard pure-Rust charting library; `plotters-iced` embeds a
# `plotters` drawing surface as a regular `iced` widget (no webview/JS, no
# extra runtime -- consistent with this app's "everything local" stance).
# `default-features = false` drops plotters' bitmap/image backends we don't
# need here (we only render into the iced/GPU surface via plotters-iced).
# NOTE: pin/bump `plotters-iced` to whatever version tracks `iced = "0.13"`
# on crates.io at the time you add this -- verify with `cargo add plotters-iced`.
plotters = { version = "0.3", default-features = false, features = ["chrono"] }
plotters-iced = "0.11"

# Réseau XRPL (utilisé par le CLI uniquement)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Construction/signature/soumission de transaction -- API haut niveau async,
# support Ed25519 confirmé (autofill + sign_transaction + submit_and_wait).
# Version figée EXACTEMENT ("=") plutôt qu'un simple caret : c'est la seule
# dépendance qui manipule la clé privée pour signer -- on ne veut PAS qu'un
# `cargo update` tire silencieusement une nouvelle version (compromise ou
# simplement cassée) sans revue explicite. Toute mise à jour doit être un
# changement volontaire de cette ligne + relecture du diff amont, et
# `Cargo.lock` doit être committé pour figer aussi toutes les dépendances
# transitives (xrpl-mithril-{types,codec,models,wallet,client,tx}).
xrpl-mithril = "=0.5.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
#for windows icon
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1